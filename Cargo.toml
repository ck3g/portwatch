[package]
name = "portwatch"
version = "0.1.0"
edition = "2024"
description = "An interactive terminal interface for monitoring listening ports and their processes"
license = "MIT"
repository = "https://github.com/ck3g/portwatch"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.1"
nix = { version = "0.30.1", features = ["signal"] }
ratatui = "0.29.0"
which = "8.0.0"
